name: macOS build

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'Assets/**'
      - 'Info.plist'
      - 'build.sh'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'Assets/**'
      - 'Info.plist'
      - 'build.sh'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate build script and app metadata
        run: |
          zsh -n build.sh
          plutil -lint Info.plist
      - name: Build Apple Silicon app
        run: zsh build.sh
      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "build/Ponte Fotos.app"
          plutil -lint "build/Ponte Fotos.app/Contents/Info.plist"
          lipo "build/Ponte Fotos.app/Contents/MacOS/PonteFotos" -verify_arch arm64
